[project]
name = "arch-install"
version = "0.1.0"
description = "Arch Linux Installation & Post-Configuration Scripts"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "basedpyright>=1.39",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "N"]

[tool.basedpyright]
include = ["installer", "install.py", "postinstall.py"]
pythonVersion = "3.14"

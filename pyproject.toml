[project]
name = "arch-install"
version = "0.1.0"
description = "Arch Linux Installation & Post-Configuration Scripts"
requires-python = ">=3.14"

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=2.3", "basedpyright>=1.39"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "N"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.basedpyright]
include = ["installer", "install.py", "postinstall.py"]
pythonVersion = "3.14"

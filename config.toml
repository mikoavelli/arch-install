packages = [
  { name = "code-marketplace", description = "Enable vscode marketplace in Code OSS" },
  { name = "gitstatus", description = "Git status for Bash and Zsh prompt" },
  { name = "morewaita-icon-theme", description = "An expanded Adwaita-styled companion icon theme with extra icons" },
  { name = "nautilus-open-any-terminal", description = "context-menu entry for opening other terminal in nautilus" },
  { name = "xdg-terminal-exec-git", description = "Proposed standard to launching desktop apps with Terminal=true" },
]

# Flatpak packages support optional override parameters:
# - `env`: Environment variables table, e.g. env = { QT_SCALE_FACTOR = "1.25" }
# - `fs`: Filesystem paths list to allow access, e.g. fs = ["~/Downloads"]
# - `devices`: Devices permission list. Use "device_name" to allow (--device=)
#              or "!device_name" to deny (--nodevice=), e.g. devices = ["!all"] or devices = ["dri"]
# - `sockets`: Sockets permission list. Use "socket_name" to allow (--socket=)
#              or "!socket_name" to deny (--nosocket=), e.g. sockets = ["x11", "!wayland"]
[packages.flatpak]
description = "Flatpak packages from Flathub"
packages = [
  { name = "com.discordapp.Discord", description = "Discord - Talk, play, hang out", sockets = [
    "x11",
    "!wayland",
  ], env = { XDG_SESSION_TYPE = "x11" } },
  { name = "com.obsproject.Studio", description = "OBS Studio - Live stream and record videos", env = { QT_SCALE_FACTOR = "1.25" } },
  { name = "org.keepassxc.KeePassXC", description = "KeePassXC - Secure and Full-featured Password Manager", env = { QT_SCALE_FACTOR = "1.25", QT_QPA_PLATFORM = "xcb" } },
  { name = "org.telegram.desktop", description = "Telegram - New era of messaging", fs = [
    "~/Downloads",
  ], devices = [
    "!all",
  ] },
  { name = "org.videolan.VLC", description = "VLC - VLC media player, the open-source multimedia player", env = { QT_SCALE_FACTOR = "1.25" } },
]

[services]
enable = [
  "bluetooth.service",
  "ly@tty2.service",
  "power-profiles-daemon.service",
  "systemd-resolved.service",
  "ufw.service",
]
disable = [
  "avahi-daemon.service",
  "getty@tty2.service",
  "NetworkManager-wait-online.service",
  "remote-fs.target",
  "systemd-networkd-wait-online.service",
]
mask = [
  "avahi-daemon.service",
  "NetworkManager-wait-online.service",
  "remote-fs.target",
  "systemd-networkd-wait-online.service",
]

[ufw]
description = "Firewall port configuration"
allow = []

[secureboot]
description = "Files to sign for Secure Boot"
sign_targets = [
  "/boot/EFI/BOOT/BOOTX64.EFI",
  "/boot/EFI/Linux/arch-linux.efi",
  "/boot/EFI/systemd/systemd-bootx64.efi",
  "/boot/vmlinuz-linux",
]

[locale]
description = "System locale configuration"
gen = ["en_GB.UTF-8 UTF-8", "en_US.UTF-8 UTF-8"]
conf = [
  "LANG=en_US.UTF-8",
  "LC_MEASUREMENT=en_GB.UTF-8",
  "LC_MONETARY=en_GB.UTF-8",
  "LC_NUMERIC=en_GB.UTF-8",
  "LC_PAPER=en_GB.UTF-8",
  "LC_TIME=en_GB.UTF-8",
]

[git]
description = "Git configuration settings"
# {email} and {name} will be replaced with user input
# {sign_key} will be replaced with ~/.ssh/github-sign.pub
# {allowed} will be replaced with ~/.ssh/allowed_signers
settings = [
  { key = "commit.gpgsign", value = "true" },
  { key = "core.editor", value = "nvim" },
  { key = "gpg.format", value = "ssh" },
  { key = "gpg.ssh.allowedSignersFile", value = "{allowed}" },
  { key = "init.defaultBranch", value = "main" },
  { key = "pull.rebase", value = "true" },
  { key = "user.email", value = "{email}" },
  { key = "user.name", value = "{name}" },
  { key = "user.signingkey", value = "{sign_key}" },
]

[gschemas]
description = "Config gschemas"
packages = [
  { schema = "com.github.stunkymonkey.nautilus-open-any-terminal", key = "terminal", value = "alacritty" },
  { schema = "com.github.stunkymonkey.nautilus-open-any-terminal", key = "keybindings", value = "<Ctrl>slash" },
  { schema = "org.gnome.desktop.interface", key = "color-scheme", value = "prefer-dark" },
  { schema = "org.gnome.desktop.interface", key = "document-font-name", value = "Inter 12" },
  { schema = "org.gnome.desktop.interface", key = "enable-animations", value = "false" },
  { schema = "org.gnome.desktop.interface", key = "font-name", value = "Inter 12" },
  { schema = "org.gnome.desktop.interface", key = "gtk-theme", value = "adw-gtk3-dark" },
  { schema = "org.gnome.desktop.interface", key = "icon-theme", value = "MoreWaita" },
  { schema = "org.gnome.desktop.interface", key = "monospace-font-name", value = "JetBrainsMono Nerd Font 12" },
  { schema = "org.gnome.desktop.interface", key = "text-scaling-factor", value = "1.25" },
  { schema = "org.gnome.desktop.privacy", key = "disable-camera", value = "true" },
  { schema = "org.gnome.desktop.privacy", key = "disable-microphone", value = "true" },
  { schema = "org.gnome.desktop.privacy", key = "disable-sound-output", value = "true" },
  { schema = "org.gnome.desktop.privacy", key = "remember-recent-files", value = "false" },
  { schema = "org.gnome.desktop.wm.preferences", key = "focus-mode", value = "sloppy" },
]
